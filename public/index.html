<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#537a86">
  <meta name="application-name" content="My Life Note">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Life Note">
  <title>My Life Note</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pwa.css">
</head>
<body>
  <main id="app"></main>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button data-tab="home" aria-label="ホーム"><span>⌂</span><small>HOME</small></button>

    <button data-tab="journal" aria-label="日記"><span>✎</span><small>JOURNAL</small></button>

  <div id="modal" class="modal" hidden></div>
  <script src="app.js"></script>
